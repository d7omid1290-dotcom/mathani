<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A3D30">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>مثاني</title>
<style>
:root{
  /* الهوية: كحلي وسماوي */
  --bg:#EDF2F8; --surface:#FFFFFF; --surface-2:#F3F7FC; --ink:#0D1A2D; --muted:#5A6A80; --line:#DBE4EF;
  --deep:#0A1E3C; --green:#14335E; --green-soft:#E2ECF8; --on:#FFFFFF;
  --sky:#2F9FDB; --sky-2:#7CCBF2; --sky-soft:#E0F2FC;
  --gold:#B07816; --gold-2:#E2B04E; --gold-soft:#FBF0DA; --err:#C0353F; --err-soft:#FBE6E8; --ok:#1F8A62;
  --paper:#FCFDFF;
  --shadow:0 1px 2px rgba(10,30,60,.05),0 6px 18px rgba(10,30,60,.07);
  --quran:"Amiri Quran","Amiri","Scheherazade New",serif; --naskh:"Amiri",serif;
  --ui:"Readex Pro","Segoe UI","Tahoma",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  --fs:1;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081325; --surface:#0F1F38; --surface-2:#152A47; --ink:#E7EEF8; --muted:#94A6BE; --line:#22385A;
  --deep:#06101F; --green:#8CC8F4; --green-soft:#16304F; --on:#081325;
  --sky:#5DBDF0; --sky-2:#8FD6F7; --sky-soft:#12324F;
  --gold:#E6B85C; --gold-2:#E8C77F; --gold-soft:#33291A; --err:#F0939A; --err-soft:#3D2128; --ok:#6FD3A8;
  --paper:#0C1B31; --shadow:0 1px 2px rgba(0,0,0,.35);}}
:root[data-theme="dark"]{
  --bg:#081325; --surface:#0F1F38; --surface-2:#152A47; --ink:#E7EEF8; --muted:#94A6BE; --line:#22385A;
  --deep:#06101F; --green:#8CC8F4; --green-soft:#16304F; --on:#081325;
  --sky:#5DBDF0; --sky-2:#8FD6F7; --sky-soft:#12324F;
  --gold:#E6B85C; --gold-2:#E8C77F; --gold-soft:#33291A; --err:#F0939A; --err-soft:#3D2128; --ok:#6FD3A8;
  --paper:#0C1B31; --shadow:0 1px 2px rgba(0,0,0,.35);}
html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.65;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{max-width:480px;min-height:100%;margin:0 auto;background:var(--bg);position:relative}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--line)}}
.content{padding:0 16px calc(110px + var(--bottom))}

/* الزخرفة: نجمة ثمانية متكررة */
.pattern{background:radial-gradient(120% 80% at 85% -10%,rgba(47,159,219,.45),transparent 60%),repeating-linear-gradient(to bottom,transparent 0 27px,rgba(124,203,242,.08) 27px 28px),linear-gradient(165deg,#0A1E3C,#102C55 70%,#163D6E);color:#fff}

/* شريط علوي */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  padding:calc(var(--top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;margin:0 -16px 6px;padding-inline:16px}
.bar h1{margin:0;font-size:1.1rem;font-weight:600;flex:1;line-height:1.3}
.bar h1 small{display:block;font-size:.75rem;font-weight:400;color:var(--muted)}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn svg{width:20px;height:20px}

/* التنقل السفلي مع زر التسميع الأوسط */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 8px calc(8px + var(--bottom))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-size:.7rem;color:var(--muted)}
.tabs button svg{width:23px;height:23px}
.tabs button[aria-current="page"]{color:var(--green);font-weight:600}
.tabs .fab{margin-top:-30px}
.tabs .fab span.c{width:60px;height:60px;border-radius:50%;background:linear-gradient(140deg,var(--green),var(--sky));color:var(--on);display:grid;place-items:center;box-shadow:0 6px 16px rgba(10,30,60,.35);border:4px solid var(--surface)}
.tabs .fab[aria-current="page"] span.c{background:var(--deep)}
.tabs .fab svg{width:26px;height:26px}

/* عناصر عامة */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
.sec h2{margin:0;font-size:1rem;font-weight:600}
.sec a,.link{color:var(--green);font-size:.85rem;font-weight:500;background:none;border:0;padding:0}
.link.sinfo{flex:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:.8rem;background:color-mix(in srgb,var(--sky) 14%,transparent);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:.82rem} .tiny{font-size:.72rem}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:600;background:var(--green-soft);color:var(--green);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--green);color:var(--on)}

.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;font-size:.68rem;border-radius:999px;padding:1px 9px;font-weight:600}
.badge.ok{background:var(--green-soft);color:var(--green)} .badge.draft{background:var(--gold-soft);color:var(--gold)}
.alert{border-radius:14px;padding:12px 14px;background:var(--err-soft);color:var(--err);font-size:.86rem;margin-top:12px}
.info{border-radius:14px;padding:12px 14px;background:var(--surface-2);color:var(--muted);font-size:.86rem}
.ayah{font-family:var(--quran);font-size:1.55rem;line-height:2.2}
.end{display:inline-grid;place-items:center;vertical-align:middle;min-width:1.55em;height:1.55em;margin:0 .15em;padding:0 .2em;
  font-family:var(--ui);font-size:.5em;font-weight:700;line-height:1;color:var(--green);background:var(--sky-soft);
  border:1.5px solid var(--sky);border-radius:50%;box-shadow:0 0 0 2px var(--paper),0 0 0 3px var(--sky-2)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* الرئيسية */
.hero{margin:0 -16px;padding:calc(var(--top) + 18px) 20px 72px;color:#fff;border-radius:0 0 28px 28px}
.hero .top{display:flex;justify-content:space-between;align-items:center}
.hero .logo{font-family:var(--quran);font-size:2.1rem;line-height:1;color:var(--sky-2)}
.hero .date{font-size:.78rem;opacity:.8}
.hero h2{font-weight:500;font-size:1.3rem;margin:18px 0 2px}
.hero p{margin:0;opacity:.8;font-size:.9rem}
.lift{margin-top:-52px;position:relative}
.continue{display:flex;gap:14px;align-items:center}
.ring{--p:0;--s:74px;width:var(--s);height:var(--s);border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--surface) 80%,transparent 81%),conic-gradient(var(--green) calc(var(--p)*1%),var(--line) 0)}
.ring b{font-size:1.05rem;font-weight:700}
.ring small{display:block;font-size:.6rem;color:var(--muted);margin-top:-4px;text-align:center}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qa button{border:0;text-align:start;background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.qa .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.qa .ic svg{width:22px;height:22px}
.qa b{font-weight:600;font-size:.95rem}
.qa span.t{font-size:.75rem;color:var(--muted);margin-top:-8px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);width:100%;border:0;text-align:start}
.item+.item{margin-top:10px}
.pg{width:42px;height:54px;border-radius:7px;flex:none;display:grid;place-items:center;font-weight:700;color:var(--green);background:var(--h,var(--surface-2));border:1px solid var(--line);position:relative}
.chip{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;background:var(--green-soft);color:var(--green);flex:none}
.chip.mid{background:var(--gold-soft);color:var(--gold)} .chip.low{background:var(--err-soft);color:var(--err)}

/* المصحف */
.juzhead{border-radius:20px;padding:18px;color:#fff;margin-top:4px}
.juzhead b{font-family:var(--naskh);font-size:1.4rem;font-weight:700}
.bar-p{height:6px;border-radius:6px;background:rgba(255,255,255,.18);margin-top:10px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--sky-2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin:14px 2px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);margin-inline-end:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:8px;display:flex;flex-direction:column;gap:6px;text-align:start}
.tile .pp{aspect-ratio:4/5;border-radius:6px;border:1px solid var(--line);background:var(--h,var(--surface-2));position:relative;overflow:hidden}
.tile .pp::before{content:"";position:absolute;inset:7px 6px;background:repeating-linear-gradient(to bottom,var(--line) 0 1.5px,transparent 1.5px 6px);opacity:.9}
.tile .pp::after{content:"";position:absolute;inset:3px;border:1px solid color-mix(in srgb,var(--sky) 40%,transparent);border-radius:3px}
.tile b{font-size:.85rem}
.tile span{font-size:.66rem;color:var(--muted);margin-top:-6px}

/* قارئ الوجه */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--shadow);margin-bottom:14px}
.seg button{border:0;background:none;border-radius:11px;padding:8px 2px;font-size:.85rem;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--on)}
.page{background:var(--paper);border-radius:14px;padding:8px;box-shadow:var(--shadow)}
.page-in{border:3px double var(--green);border-radius:10px;padding:5px}
.page-in2{border:1px solid var(--sky-2);border-radius:7px;padding:10px 14px 8px;position:relative}
.phead{display:flex;justify-content:space-between;align-items:center;font-family:var(--naskh);font-size:.95rem;color:var(--green);
  border-bottom:1px solid var(--sky-2);padding:0 2px 6px;margin-bottom:8px}
.phead span{font-weight:700}
.banner{position:relative;margin:6px 10px 10px;border-radius:10px;padding:6px 10px;background:var(--green);color:#fff;text-align:center;
  font-family:var(--naskh);font-weight:700;font-size:1.2rem;box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 3px var(--sky-2)}
.banner::before,.banner::after{content:"";position:absolute;top:50%;width:14px;height:14px;background:var(--sky);transform:translateY(-50%) rotate(45deg);border:2px solid var(--paper)}
.banner::before{right:-8px} .banner::after{left:-8px}
.basmala{text-align:center;font-family:var(--quran);font-size:calc(1.45rem * var(--fs));margin-bottom:4px;color:var(--green)}
.text{font-family:var(--quran);font-size:calc(1.62rem * var(--fs));line-height:2.35;text-align:justify;text-align-last:center}
.text .a{border-radius:6px;cursor:pointer;transition:background .15s}
.text .a:hover,.text .a.sel{background:var(--sky-soft)}
.text .a.m{text-decoration:underline dotted var(--gold-2);text-decoration-thickness:2px;text-underline-offset:.55em}
.text .a.m:hover{background-color:var(--gold-soft)}
.text.hide .w{filter:blur(6px)} .text.hide .w.shown{filter:none}
.pagefoot{display:flex;justify-content:center;margin-top:6px}
.pagefoot span{min-width:34px;height:34px;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--green);
  background:var(--sky-soft);border:1px solid var(--sky-2);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);padding:0 6px}
.mtool{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:12px}
.mtool .vs{display:grid;grid-template-columns:1fr 1fr;gap:2px;flex:1;background:var(--surface-2);border-radius:12px;padding:3px}
.mtool .vs button{border:0;background:none;border-radius:9px;padding:7px 4px;font-size:.84rem;font-weight:500;color:var(--muted)}
.mtool .vs button[aria-pressed="true"]{background:var(--green);color:var(--on)}
.mtool .fz{display:flex;gap:2px}
.mtool .fz button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);font-weight:700;color:var(--green)}
.mtool .eye{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);color:var(--green);display:grid;place-items:center}
.mtool .eye[aria-pressed="true"]{background:var(--green);color:var(--on)}
.mtool .eye svg{width:18px;height:18px}
.tsrc{display:flex;gap:6px;margin:-2px 0 12px;flex-wrap:wrap}
.tsrc button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.78rem;color:var(--muted)}
.tsrc button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--green);font-weight:600}
.tsrc button:disabled{opacity:.45}
.ta{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ta+.ta{margin-top:10px}
.ta .q{padding:12px 16px 8px;font-family:var(--quran);font-size:calc(1.55rem * var(--fs));line-height:2.2;background:var(--paper);border-bottom:1px dashed var(--sky-2);cursor:pointer}
.ta .tx{padding:10px 16px 12px;line-height:1.95;font-size:calc(.95rem * (0.6 + var(--fs) * .4))}
.ta .tx .lbl{font-size:.7rem;font-weight:700;color:var(--sky);display:block;margin-bottom:2px}
.ta .mchip{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--gold-soft);color:var(--gold);font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 10px;margin:0 16px 12px}
.tgroup{background:var(--sky-soft);border-inline-start:4px solid var(--sky);border-radius:14px;padding:12px 14px;margin:14px 0 10px;line-height:1.95}
.tgroup .lbl{font-size:.72rem;font-weight:700;color:var(--green);display:block;margin-bottom:4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.switch{width:48px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);transition:inset-inline-start .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"]{background:var(--green)} .switch[aria-checked="true"]::after{inset-inline-start:23px}
.recite-cta{position:fixed;bottom:calc(86px + var(--bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:448px;z-index:25;box-shadow:0 8px 20px rgba(10,30,60,.3)}

.verse{padding:14px 0;border-bottom:1px solid var(--line)} .verse:first-child{padding-top:4px} .verse:last-child{border-bottom:0;padding-bottom:4px}
.verse p{margin:6px 0 0}
.gh{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.gh span{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:2px 10px;font-size:.82rem}
.gh b{font-family:var(--quran);font-weight:400;font-size:1.05rem;margin-inline-end:5px;color:var(--green)}
.src{font-size:.72rem;color:var(--muted);margin:10px 4px 0}
.htitle{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 10px}
.htitle h3{margin:0;font-size:.98rem;font-weight:600;display:flex;align-items:center;gap:8px}
.htitle h3 svg{width:18px;height:18px;color:var(--sky)}
.topic{font-family:var(--naskh);font-size:1.2rem;line-height:1.9}
.today{border-radius:18px;padding:16px;color:#fff;border:1px solid color-mix(in srgb,var(--sky-2) 40%,transparent)}
.today .ayah{font-size:1.5rem;color:#fff}
.an{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)} .an:last-child{border-bottom:0}
.an .t{flex:none;font-size:.7rem;font-weight:700;border-radius:8px;padding:3px 9px;margin-top:9px}
.an .t.amr{background:var(--green-soft);color:var(--green)} .an .t.nahy{background:var(--err-soft);color:var(--err)}
.an .ayah{font-size:1.3rem;line-height:1.9}
.fw{margin:0;padding:0;list-style:none}
.fw li{position:relative;padding-inline-start:20px} .fw li+li{margin-top:8px}
.fw li::before{content:"";position:absolute;inset-inline-start:2px;top:.65em;width:8px;height:8px;transform:rotate(45deg);background:var(--sky);border-radius:1px}

/* المقارنة */
.compare{border-radius:16px;overflow:hidden;margin-top:12px;background:var(--surface);border:1px solid var(--gold-2)}
.compare header{background:var(--gold-soft);color:var(--gold);padding:9px 14px;font-weight:600;font-size:.85rem}
.compare .side{padding:12px 14px} .compare .side+.side{border-top:1px dashed var(--line)}
.compare h4{margin:0;font-size:.78rem;font-weight:600;color:var(--muted)}
.compare .diff{background:var(--gold-soft);color:var(--gold);border-radius:4px;padding:0 3px;box-shadow:inset 0 -2px 0 var(--gold-2)}
.compare .ctx{font-size:.8rem;color:var(--muted);margin-top:6px}

/* استوديو التسميع */
.target{display:flex;align-items:center;gap:12px}
.target .pg{--h:var(--sky-soft);color:var(--green)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.modes button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.8rem;font-weight:500;color:var(--muted)}
.modes button svg{width:22px;height:22px}
.modes button[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.studio{display:flex;flex-direction:column;align-items:center;padding:26px 16px 18px;margin-top:14px}
.mic{width:120px;height:120px;border-radius:50%;border:0;background:linear-gradient(140deg,var(--green),var(--sky));color:var(--on);display:grid;place-items:center;position:relative;box-shadow:0 10px 26px rgba(10,30,60,.32)}
.mic svg{width:44px;height:44px}
.mic::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--green-soft)}
.mic.on{background:var(--err);box-shadow:0 10px 26px rgba(178,58,65,.35)}
.mic.on::before{border-color:var(--err-soft);transform:scale(calc(1 + var(--lvl,0)*.35))}
.clock{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;margin-top:16px;letter-spacing:.5px}
.wave{width:100%;height:46px;margin-top:6px}
.cap{font-size:.84rem;color:var(--muted);text-align:center;max-width:30ch}
.live{width:100%;min-height:3.4em;font-family:var(--quran);font-size:1.3rem;line-height:1.9;color:var(--ink);background:var(--surface-2);border-radius:14px;padding:10px 14px;margin-top:14px}
.live:empty::before{content:attr(data-empty);color:var(--muted);font-family:var(--ui);font-size:.85rem}
.player{width:100%;display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:16px;padding:10px 12px;margin-top:16px}
.play{width:44px;height:44px;border-radius:50%;border:0;background:var(--green);color:var(--on);display:grid;place-items:center;flex:none}
.play svg{width:20px;height:20px}
.ptrack{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.ptrack i{display:block;height:100%;width:0;background:var(--green)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:14px}
.prog{width:100%;height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--green);transition:width .2s}
textarea{width:100%;min-height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-family:var(--quran);font-size:1.3rem;line-height:2;resize:vertical}
.hint{background:var(--sky-soft);border-radius:14px;padding:12px 14px;margin-top:14px;width:100%}
.hint .lvl{font-size:.74rem;color:var(--muted);font-weight:500}

/* النتيجة */
.score{display:flex;align-items:center;gap:16px}
.score .ring{--s:92px} .score .ring b{font-size:1.35rem}
.res{background:var(--surface);border-radius:16px;padding:12px 14px;margin-top:10px;box-shadow:var(--shadow);border-inline-start:4px solid var(--ok)}
.res.error{border-color:var(--err)} .res.transition{border-color:var(--gold-2)} .res.notReached{border-color:var(--line)}
.res .tag{font-size:.8rem;font-weight:600}
.w-del{color:var(--err);text-decoration:line-through;opacity:.85}
.w-sub{color:var(--err);box-shadow:inset 0 -2px 0 var(--err)}
.w-note{font-family:var(--ui);font-size:.66rem;color:var(--err);vertical-align:super;margin-inline-start:2px}
.w-ins{font-family:var(--ui);font-size:.72rem;color:var(--err);background:var(--err-soft);border-radius:5px;padding:0 5px}

/* اختبار */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:start;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:8px 14px;font-family:var(--quran);font-size:1.3rem;line-height:1.85}
.opt.ui{font-family:var(--ui);font-size:.95rem;padding:12px 14px}
.opt.right{border-color:var(--ok);background:var(--green-soft)} .opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt .pick{font-family:var(--ui);font-size:.72rem;color:var(--on);background:var(--green);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.qprog{height:5px;background:var(--line);border-radius:5px;overflow:hidden;margin-bottom:12px} .qprog i{display:block;height:100%;background:var(--sky)}

/* الورقة السفلية */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 16px calc(20px + var(--bottom))}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0 0 4px;font-size:1.05rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:.5}}}
.pick-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pick-grid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-weight:600}
.pick-grid button[aria-pressed="true"]{background:var(--green);color:var(--on);border-color:var(--green)}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.selects label{font-size:.75rem;color:var(--muted)}
.selects select{width:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.empty{text-align:center;padding:30px 16px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--gold-2);margin-bottom:6px}

/* التسميع المباشر: الوجه مخفي وينكشف مع القراءة */
.fstat{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 2px 8px}
.fstat .prog{flex:1;margin:0}
.fpage .text{text-align:justify;text-align-last:auto}
.fw{border-radius:5px;transition:color .3s ease,background-color .3s ease;-webkit-user-select:none;user-select:none}
.fw.h{color:transparent;background-image:linear-gradient(var(--line),var(--line));background-size:100% 34%;background-position:center 58%;background-repeat:no-repeat}
.fw.cur{background-image:linear-gradient(var(--sky),var(--sky))}
.fw.ok{color:var(--ink)}
.fw.new{color:var(--green)}
.fw.skip{color:var(--err);text-decoration:line-through;text-decoration-thickness:1px}
.fw.hint{color:var(--gold)}
.fw.bad{background-image:linear-gradient(var(--err),var(--err))}
@media (prefers-reduced-motion:no-preference){.fw.cur{animation:blink 1.2s ease-in-out infinite}@keyframes blink{50%{opacity:.45}}.fw.bad{animation:shake .3s}@keyframes shake{25%{transform:translateX(3px)}75%{transform:translateX(-3px)}}}
.fpage .end{opacity:.55}
.ctrl{position:fixed;bottom:calc(84px + var(--bottom));left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;z-index:26;
  background:var(--surface);border-radius:22px;box-shadow:0 8px 28px rgba(23,34,31,.18);padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ctrl .mic{width:64px;height:64px;box-shadow:none} .ctrl .mic svg{width:28px;height:28px} .ctrl .mic::before{inset:-6px}
.ctrl .side{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:500}
.ctrl .side svg{width:22px;height:22px;color:var(--green)}
.heard{font-size:.78rem;color:var(--muted);text-align:center;min-height:1.4em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.heard b{font-family:var(--quran);font-weight:400;font-size:1.05rem;color:var(--ink)}
.toast{border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:.86rem;display:flex;align-items:center;gap:10px}
.toast.gold{background:var(--gold-soft);color:var(--gold)} .toast.red{background:var(--err-soft);color:var(--err)}
/* واجهة إنجليزية: نص المصحف يبقى من اليمين، وكل فقرة تأخذ اتجاه لغتها */
[dir="ltr"] :is(.rd,.page,.fpage,.ayah,.basmala,.banner,.opts:not(:has(.ui)),.compare .side,.ww,.qw,.today .ayah){direction:rtl}
[dir="ltr"] :is(p,div,h1,h2,h3,h4,li,summary,label,small,b){unicode-bidi:plaintext}
[dir="ltr"] .rd *{unicode-bidi:normal}

/* الورد اليومي والبستان */
.wcard{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(20,51,94,.06);border:0;text-align:start;font:inherit;color:inherit}
.wcard.col{flex-direction:column;align-items:stretch}.wcard.setup{cursor:pointer;background:linear-gradient(135deg,color-mix(in srgb,var(--green) 10%,var(--surface)),var(--surface))}
.wbtn{background:var(--green);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;font-size:.9rem;flex:none}
.wrow{display:flex;gap:10px;align-items:center;padding:6px 0}.wrow+.wrow{border-top:1px dashed var(--line)}
.we{font-size:1.4rem;width:34px;text-align:center;flex:none}
.wz h3{margin:0 0 6px}.wopts{display:grid;gap:8px;margin-top:10px}.wopts.g3{grid-template-columns:1fr 1fr 1fr}.wopts.g5{grid-template-columns:repeat(5,1fr)}
.wopt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;padding:12px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font:inherit;color:inherit;cursor:pointer}
.wopts.g3 .wopt,.wopts.g5 .wopt{align-items:center;text-align:center;padding:12px 4px}
.wopt small{color:var(--muted);font-size:.78rem}.wopt[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--surface))}
.wopt.cust{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}.wopt.cust input{width:70px;padding:6px;border-radius:10px;border:1px solid var(--line);text-align:center;font:inherit}
.wdays{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.wdays button{flex:1 0 22%;padding:8px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font:inherit;font-size:.82rem;color:inherit;cursor:pointer}
.wdays button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.wsel{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid var(--line);font:inherit;background:var(--surface);color:inherit}
.wday{padding:10px 0;border-top:1px dashed var(--line)}.wday:first-of-type{border-top:0}.wday .small{margin-top:3px}
.wtask{margin-bottom:12px}.wtask.done{opacity:.85;background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.wbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.wbtns .btn{flex:1 1 auto;padding:10px 12px;font-size:.85rem;white-space:nowrap}.wbtns .btn svg{width:18px;height:18px}
.wdone{display:flex;gap:6px;align-items:center;margin-top:10px;color:var(--ok);font-weight:700}.wdone svg{width:20px;height:20px}
.wmiss{border:1.5px solid var(--gold-2);background:var(--gold-soft)}.wtip{display:flex;gap:10px;align-items:flex-start}.wtip>span{font-size:1.2rem}
.wfin{text-align:center;margin-top:14px;font-weight:700;font-size:1.05rem}.wfin .link{margin-top:8px}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:4px 0 12px}
.pst{background:var(--surface);border-radius:18px;padding:14px 6px;text-align:center;box-shadow:0 10px 30px rgba(20,51,94,.06)}.pst b{display:block;font-size:1.4rem;color:var(--green)}.pst span{font-size:.75rem;color:var(--muted)}
.garden{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#CFEAF7 0,#EAF6FB 38%,var(--g1) 38%,var(--g2) 100%);min-height:220px}
.gsky{position:absolute;top:10px;inset-inline-end:16px;font-size:1.8rem}
.gland{position:absolute;inset:40% 0 0 0;padding:14px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;font-size:1.7rem;line-height:1.2}
.gland .tiny{font-size:.8rem;background:rgba(255,255,255,.7);padding:6px 10px;border-radius:10px}
.garden.sm{min-height:0;padding:12px 14px;font-size:1.5rem;letter-spacing:2px;background:linear-gradient(180deg,var(--g1),var(--g2));text-align:center}
.glist{display:flex;gap:10px;align-items:center;padding:6px 0}.glist span{font-size:1.3rem;width:28px;text-align:center}
.langrow{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer;align-items:center}
.langrow svg,.langs svg{width:20px;height:20px;flex:none}
.langs{display:flex;flex-direction:column;gap:8px}.langs .item{width:100%;text-align:start;font:inherit;color:inherit;cursor:pointer}
.langs .item[aria-pressed="true"]{border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--card))}
[dir="ltr"] svg.flip{transform:scaleX(-1)}
.toast.green{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.fpage[hidden]{display:none}
.pw{color:var(--muted);opacity:.55}
.autoloc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-bottom:10px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.autoloc input{width:20px;height:20px;margin-top:3px;accent-color:var(--green);flex:none}
.autoloc span{display:flex;flex-direction:column;gap:2px}.autoloc small{color:var(--muted);font-size:.8rem;line-height:1.5}
.locwait{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:34px 18px}
.locwait svg{width:38px;height:38px;color:var(--green)}
.toast button{margin-inline-start:auto;border:0;background:var(--surface);color:inherit;border-radius:10px;padding:5px 10px;font-weight:600;font-size:.8rem}
.typein{display:flex;gap:8px;margin-top:10px}
.typein input{flex:1}

.search{width:100%;background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:14px;padding:12px 16px;margin-top:12px}
.sl{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow);text-align:start}
.sl+.sl{margin-top:8px}
.sl .no{width:38px;height:38px;flex:none;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--green);
  background:var(--sky-soft);clip-path:polygon(50% 0,64% 14%,85% 15%,86% 36%,100% 50%,86% 64%,85% 85%,64% 86%,50% 100%,36% 86%,15% 85%,14% 64%,0 50%,14% 36%,15% 15%,36% 14%)}
.sl .nm{font-family:var(--naskh);font-weight:700;font-size:1.2rem;line-height:1.3}
.jz{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.jz summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.jz summary::-webkit-details-marker{display:none}
.jz .grid{padding:0 12px 12px;grid-template-columns:repeat(5,1fr);gap:8px}
.jz .tile{box-shadow:none;border:1px solid var(--line);padding:6px}
.pnav{display:flex;gap:6px}

.dsec{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-top:10px;overflow:hidden}
.dsec summary{list-style:none;cursor:pointer;padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dsec summary::-webkit-details-marker{display:none}
.dsec summary::after{content:"";width:8px;height:8px;border-inline-start:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none}
.dsec[open] summary::after{transform:rotate(135deg)}
.dsec .body{padding:0 16px 14px;white-space:pre-line;line-height:1.95}
.dsrc{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);margin:10px 4px 0}
.dsrc b{color:var(--sky);font-weight:600}
.ijmali{background:var(--sky-soft);border-inline-start:4px solid var(--sky);border-radius:16px;padding:14px 16px;line-height:2}
.ijmali .tiny{color:var(--green);font-weight:600;margin-bottom:4px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:14px;padding:10px 8px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.1rem;font-weight:700;color:var(--green)}
.stat span{font-size:.72rem;color:var(--muted)}

/* ===== شريط المصحف: ٦٠٤ وجه في خط واحد ===== */
.qstrip{position:relative;height:70px;margin-top:26px;cursor:pointer;touch-action:pan-y}
.qstrip canvas{width:100%;height:100%;display:block}
.qstrip .lbls{display:flex;justify-content:space-between;font-size:.66rem;opacity:.7;margin-top:6px}
.qstrip .here{position:absolute;top:-6px;bottom:18px;width:2px;background:#fff;border-radius:2px;pointer-events:none}
.qstrip .here.edgeR::after{transform:none;right:-2px}
.qstrip .here.edgeL::after{transform:translateX(100%);right:auto;left:-2px}
.qstrip .here::after{content:attr(data-p);position:absolute;top:-20px;transform:translateX(50%);right:0;font-size:.68rem;font-weight:700;background:#fff;color:var(--deep);border-radius:6px;padding:1px 6px;white-space:nowrap}
/* ===== الرئيسية ===== */
.h2{margin:0 -16px;padding:calc(var(--top) + 16px) 20px 22px;border-radius:0 0 30px 30px}
.h2 .top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;opacity:.85}
.h2 .word{font-family:var(--quran);font-size:4.6rem;line-height:1.1;margin:10px 0 0;letter-spacing:0;color:#fff}
.h2 .word small{display:block;font-family:var(--quran);font-size:1.05rem;color:var(--sky-2);margin-top:4px}
.h2 .greet{font-size:.95rem;opacity:.9;margin-top:10px}
.now{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;margin-top:18px}
.now .big{font-family:var(--naskh);font-weight:700;font-size:3.4rem;line-height:1;color:var(--green);border-inline-end:2px solid var(--sky);padding-inline-end:16px}
.now .big small{display:block;font-family:var(--ui);font-size:.68rem;font-weight:500;color:var(--muted);margin-top:6px}
.now .t{font-weight:600}
.journey{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:26px 0 6px}
.journey::before{content:"";position:absolute;top:22px;right:12.5%;left:12.5%;height:2px;background:linear-gradient(to left,var(--green),var(--sky))}
.journey button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);font-weight:600;font-size:.86rem}
.journey .dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--sky);color:var(--green)}
.journey .dot svg{width:21px;height:21px}
.journey button:first-child .dot{background:var(--green);border-color:var(--green);color:#fff}
.journey small{font-weight:400;font-size:.68rem;color:var(--muted);margin-top:-6px}
.rail{border-inline-start:2px solid var(--sky);padding-inline-start:14px;margin-top:26px}
.rail h2{margin:0 0 2px;font-size:.98rem;font-weight:700}
.rail .sub{font-size:.75rem;color:var(--muted);margin-bottom:10px}
.row2{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:start}
.row2:last-child{border-bottom:0}
.row2 .n{font-family:var(--naskh);font-weight:700;font-size:1.5rem;color:var(--green);min-width:44px;text-align:center}
/* ===== لوحة التفسير تحت المصحف ===== */
.tpanel{margin-top:12px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border-top:3px solid var(--sky)}
.tpanel .th{display:flex;align-items:center;gap:8px;padding:10px 12px 8px 14px}
.tpanel .th b{flex:1;font-size:.92rem}
.tpanel .th button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface-2);color:var(--green);display:grid;place-items:center}
.tpanel .th button svg{width:18px;height:18px}
.tpanel .tabs3{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto}
.tpanel .tabs3 button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.76rem;color:var(--muted)}
.tpanel .tabs3 button[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft);color:var(--green);font-weight:600}
.tpanel .tb{padding:4px 16px 16px;line-height:2;font-size:calc(.98rem * (0.6 + var(--fs) * .4))}
.tpanel .tb .ay{font-family:var(--quran);font-size:calc(1.3rem * var(--fs));line-height:2;color:var(--green);margin-bottom:6px}
.tpanel .mbtn{margin:0 16px 14px}
.text .a.sel{background:var(--sky-soft);box-shadow:0 0 0 2px var(--sky-soft)}

/* ================= التصميم المحسّن ================= */
body{background:#F3F7FC;background-image:linear-gradient(180deg,#E6EFFA 0,#F3F7FC 520px);background-repeat:no-repeat}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(180deg,#0B1A33 0,#081325 340px)}}
.app{background:transparent}
.card,.item,.tile,.qa button,.sl,.dsec,.ta,.tpanel,.res,.stat,.jz,.seg,.mtool{border-radius:22px;box-shadow:0 10px 30px rgba(20,51,94,.07);border:1px solid rgba(20,51,94,.05)}
.btn{border-radius:16px}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--sky));box-shadow:0 8px 18px rgba(47,159,219,.28)}
.bar{background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bar h1{font-size:1.45rem;font-weight:700}
.bar h1 small{margin-top:4px}
/* شريط التنقل العائم */
.tabs{bottom:calc(10px + var(--bottom));width:calc(100% - 24px);max-width:456px;border-radius:26px;border:1px solid rgba(20,51,94,.08);
  background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(10,30,60,.16);padding:6px 6px 8px}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs button[aria-current="page"] svg{filter:drop-shadow(0 4px 8px rgba(47,159,219,.35))}
.tabs .fab{margin-top:-34px}
.tabs .fab span.c{border:5px solid var(--bg)}
.content{padding-bottom:calc(126px + var(--bottom))}
.recite-cta{bottom:calc(98px + var(--bottom));border-radius:18px}
.ctrl{bottom:calc(96px + var(--bottom))}
/* الرئيسية */
.hd{display:flex;align-items:center;gap:12px;padding:calc(var(--top) + 18px) 2px 6px}
.hd .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--green),var(--sky));font-size:1.1rem}
.hd .hi{flex:1}.hd .hi small{display:block;color:var(--muted);font-size:.78rem}.hd .hi b{font-size:1.2rem}
.hd .date{font-size:.72rem;color:var(--muted);text-align:left}
.heroC{position:relative;overflow:hidden;margin-top:16px;border-radius:28px;padding:20px;color:#fff;

}

/* ---------- اللغات: ترجمة الواجهة فقط؛ نص المصحف والتفسير والمعاني تبقى بالعربية كما هي في مصادرها ---------- */
const I18N = /*I18N*/;
const LANGS = [["ar", "العربية", "Arabic"], ["en", "English", "English"], ["ur", "اردو", "Urdu"]];
const LG = ST.lang && I18N[ST.lang] ? ST.lang : "ar";
const TR = (() => {
  const AL = "ء-ي", names = Object.values(DATA.surahs).sort((a, b) => b.length - a.length);
  const sIdx = Object.fromEntries(Object.entries(DATA.surahs).map(([n, v]) => [v, +n]));
  const B = "\u0621-\u064A\u064B-\u0652\u0670\u0640", PERSON = new Set(["محمد", "إبراهيم", "يوسف", "مريم", "هود", "نوح", "لقمان", "يونس"]);

  const dict = I18N[LG] || {}, miss = new Set(), done = new WeakMap(), outs = new Set();

/* ---------- شريط المصحف: كل وجه خط، ولونه بحسب الحفظ ---------- */
function stripHTML(id, cur) { return `<div class="qstrip" id="${id}"><canvas aria-label="خريطة المصحف"></canvas><div class="here" data-p="الوجه ${AR(cur)}"></div><div class="lbls"><span>الفاتحة</span><span>ارتفاع الخط: كثافة المتشابهات</span><span>الناس</span></div></div>`; }
function drawStrip(id, cur, onPick) { try { drawStrip0(id, cur, onPick); } catch (e) {} }
const raf = f => (window.requestAnimationFrame || (g => setTimeout(g, 16)))(f);
function drawStrip0(id, cur, onPick) {
  const box = document.getElementById(id); if (!box) return;
  const cv = box.querySelector("canvas"), W = box.clientWidth || 360, H = 46, dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.height = H + "px";
  const g = cv.getContext && cv.getContext("2d"); if (!g || !g.scale) return; g.scale(dpr, dpr);
  const n = PAGES.length, bw = W / n, juzStarts = new Set(Object.values(DATA.juz).map(r => r[0]));
  // ارتفاع كل خط = كثافة المتشابهات في الوجه، فيصير الشريط بصمةً للقرآن كله
  if (!drawStrip.dens) drawStrip.dens = PAGES.map(p => { const k = DATA.pages[p]; return k.filter(x => DATA.mutashabihat[x]).length / k.length; });
  for (let p = 1; p <= n; p++) {
    const x = W - p * bw, h = H * (0.18 + 0.82 * drawStrip.dens[p - 1]);
    g.fillStyle = juzStarts.has(p) ? "rgba(217,174,82,.85)" : "rgba(122,214,181,.38)";
    g.fillRect(x, (H - h) / 2, Math.max(bw - .2, .5), h);
  }
  for (const [pp, r] of Object.entries(ST.pages)) { // الأوجه المسمَّعة فوق كل شيء وبعرض واضح
    const p = +pp, x = W - p * bw, w = Math.max(bw, 2.5);
    g.fillStyle = r.errors === 0 ? "#FFFFFF" : r.errors <= 3 ? "#E2B04E" : "#F0939A";
    g.fillRect(x - (w - bw) / 2, 2, w, H - 4);
  }
  const here = box.querySelector(".here"), rx = (cur - .5) * bw; here.style.right = rx + "px";
  here.classList.toggle("edgeR", rx < 34); here.classList.toggle("edgeL", rx > W - 34);
  box.onclick = e => { const rc = box.getBoundingClientRect(), p = Math.min(n, Math.max(1, Math.ceil((rc.right - e.clientX) / bw))); onPick(p); };
}

/* ---------- ضبط السطر بالمدّ (الكشيدة) كما في المصحف المطبوع، بدل توسيع الفراغات ---------- */
const DUAL = new Set("بتثجحخسشصضطظعغفقكلمنهيئىپچگک");      // حروف تتصل بما بعدها
const ALEFS = new Set("اأإآٱ");
const isMark = c => /[\u064B-\u065F\u0670\u06D6-\u06ED]/.test(c);
function kashidaSlots(w) {
  if (M.norm(w).join("").includes("لله")) return [];             // لفظ الجلالة له رسم خاص
  const base = []; for (let i = 0; i < w.length; i++) if (/[\u0621-\u064A\u0671-\u06D3]/.test(w[i])) base.push(i);
  if (base.length < 3) return [];
  const slots = [];
  for (let j = 0; j + 1 < base.length; j++) {
    const a = w[base[j]], b = w[base[j + 1]];
    if (!DUAL.has(a) || b === "ء") continue;
    if (a === "ل" && ALEFS.has(b)) continue;                       // لا تُكسر «لا»
    let pos = base[j] + 1; while (pos < w.length && isMark(w[pos])) pos++;
    if (pos === base[j + 1]) slots.push(pos);
  }
  return slots.reverse();                                         // الأفضل: قرب آخر الكلمة
}
function kashidaJustify(L, W) {
  if (L.classList.contains("c")) return;
  const probe = document.createElement("span"); probe.textContent = "ـــــــــــــــــــ"; probe.style.cssText = "position:absolute;visibility:hidden";
  L.appendChild(probe); const tw = probe.getBoundingClientRect().width / 10; probe.remove(); if (!tw) return;
  L.classList.add("measure");
  for (const ln of L.children) {
    if (!ln.classList.length || ln.classList.length > 1 && !ln.classList.contains("one")) { if (ln.classList.contains("hdr") || ln.classList.contains("bsm")) continue; }
    const ws = [...ln.querySelectorAll(".a")]; if (ws.length < 2) continue;
    const slack = W - ln.scrollWidth; let n = Math.floor(slack * 0.8 / tw); if (n <= 0) continue;
    const C = ws.map(el => ({ el, t: el.dataset.o || el.textContent, sl: kashidaSlots(el.dataset.o || el.textContent), c: 0 }));
    const cand = C.filter(x => x.sl.length); if (!cand.length) continue;
    const cap = 4;
    while (n > 0 && cand.some(x => x.c < cap * Math.min(2, x.sl.length))) {
      for (const x of cand) { if (n <= 0) break; if (x.c < cap * Math.min(2, x.sl.length)) { x.c++; n--; } }
    }
    for (const x of C) {
      if (!x.c) continue;
      x.el.dataset.o = x.t;
      const use = x.sl.slice(0, Math.min(2, x.sl.length)), per = use.map((_, i) => Math.floor(x.c / use.length) + (i < x.c % use.length ? 1 : 0));
      let t = x.t; use.map((pos, i) => [pos, per[i]]).sort((a, b) => b[0] - a[0]).forEach(([pos, k]) => { t = t.slice(0, pos) + "ـ".repeat(k) + t.slice(pos); });
      x.el.textContent = t;
    }
  }
  L.classList.remove("measure");
}

let LAST_MIC_ERR = "";
async function micDiagnosis() {

  const pol = document.permissionsPolicy || document.featurePolicy;
  let policy = null; try { policy = pol && pol.allowsFeature ? pol.allowsFeature("microphone") : null; } catch (e) {}
  let perm = "غير معروف"; try { perm = (await navigator.permissions.query({ name: "microphone" })).state; } catch (e) {}
  let inputs = null; try { inputs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "audioinput").length; } catch (e) {}
  const ua = navigator.userAgent, inApp = /FBAN|FBAV|Instagram|Line\/|Snapchat|TikTok|Twitter|; wv\)|GSA\//i.test(ua);
  c.push(["الصفحة آمنة (https)", isSecureContext, location.protocol]);
  c.push(["مفتوح مباشرة (ليس داخل إطار)", !inFrame, inFrame ? "داخل إطار" : "مباشر"]);

  c.push(["متصفح كامل (ليس داخل تطبيق آخر)", !inApp, inApp ? "متصفح داخل تطبيق" : "نعم"]);
  c.push(["إذن الميكروفون للموقع", perm !== "denied", { granted: "مسموح", denied: "مرفوض", prompt: "سيُسأل" }[perm] || perm]);
  c.push(["يوجد ميكروفون في الجهاز", inputs !== 0, inputs == null ? "غير معروف" : AR(inputs)]);
  c.push(["التسجيل مدعوم", !!window.MediaRecorder, window.MediaRecorder ? "نعم" : "لا"]);
  c.push(["التسميع المباشر مدعوم", !!SR, SR ? "نعم" : "يحتاج Chrome"]);
  let why = "";
  if (location.protocol === "file:") why = "فتحتَ الملف مباشرة من الجهاز. المتصفح يمنع الميكروفون للملفات المحلية؛ ارفع مجلد dist على Netlify وافتح الرابط.";
  else if (!isSecureContext) why = "الرابط ليس https، والمتصفح لا يعطي الميكروفون إلا لروابط https.";
  else if (policy === false || (inFrame && /NotAllowed|not-allowed/.test(LAST_MIC_ERR))) why = "التطبيق مفتوح داخل إطار يمنع الميكروفون، مثل صفحة المعاينة في Claude. هذا المنع لا تغيّره أذونات المتصفح؛ افتح التطبيق من رابطك المنشور مباشرة.";

  else if (perm === "denied") why = "الموقع مرفوض في أذونات المتصفح. غيّره إلى «سماح» من أيقونة القفل بجانب الرابط، ثم حدّث الصفحة.";
  else if (inputs === 0) why = "لم يجد المتصفح أي ميكروفون متصل بالجهاز.";

    <div class="wopts g5">${[7, 6, 5, 4, 3].map(n => opt("nd", n, `${AR(n)} أيام`)).join("")}</div>
    <div class="wdays">${WD.DAYN.map((n, i) => `<button data-day="${i}" aria-pressed="${z.days.includes(i)}">${n}</button>`).join("")}</div>`;
  if (s === "hifz") body = `<h3>مقدار الحفظ اليومي</h3><div class="wopts g3">${[[3, "٣ أسطر"], [5, "٥ أسطر"], [7, "٧ أسطر"], [8, "نصف صفحة"], [15, "صفحة"]].map(([v, l]) => opt("hLines", v, l)).join("")}
    <label class="wopt cust"><b>مقدار مخصص</b><span><input type="number" min="1" max="60" id="hCust" value="${[3, 5, 7, 8, 15].includes(+z.hLines) ? "" : z.hLines}"> سطراً</span></label></div>
    <h3 style="margin-top:18px">المراجعة اليومية</h3><p class="small muted">مراجعة تراكمية للمحفوظ، ويُقدَّم فيها ما يكثر فيه خطؤك.</p>
    <div class="wopts g5">${[[0, "بلا"], [1, "وجه"], [2, "وجهان"], [3, "٣ أوجه"], [5, "٥ أوجه"]].map(([v, l]) => opt("rPages", v, l)).join("")}</div>`;
  if (s === "tilawa") body = `<h3>مقدار التلاوة اليومية</h3><div class="wopts g3">${[[1, "صفحة"], [2, "صفحتان"], [3, "٣ صفحات"], [5, "٥ صفحات"], [20, "جزء"]].map(([v, l]) => opt("tPages", v, l)).join("")}
    <label class="wopt cust"><b>مقدار مخصص</b><span><input type="number" min="1" max="100" id="tCust" value="${[1, 2, 3, 5, 20].includes(+z.tPages) ? "" : z.tPages}"> صفحة</span></label></div>`;
  if (s === "from") body = `<h3>من أين تبدأ؟</h3><div class="wopts">${opt("from", "start", "من أول المصحف")}${opt("from", "surah", "من سورة معينة")}${opt("from", "juz", "من جزء معين")}${opt("from", "page", "من صفحة معينة")}${opt("from", "last", "من آخر موضع وصلت إليه", `الوجه ${AR(ST.last || 1)}`)}</div>
    ${z.from === "surah" ? `<select id="fs" class="wsel">${SURAHS.map(n => `<option value="${n}" ${+z.fs === n ? "selected" : ""}>${AR(n)}. ${DATA.surahs[n]}</option>`).join("")}</select>` : ""}
    ${z.from === "juz" ? `<select id="fj" class="wsel">${Object.keys(DATA.juz).map(n => `<option value="${n}" ${+z.fj === +n ? "selected" : ""}>الجزء ${JUZ_NAMES[n]}</option>`).join("")}</select>` : ""}
    ${z.from === "page" ? `<input type="number" id="fp" class="wsel" min="1" max="604" value="${z.fp}">` : ""}`;
  if (s === "preview") {
    const st = startPoint(z), sim = { hKey: st.k, tPos: st.p };
    const saved = ST.wird; ST.wird = Object.assign({ log: {}, mem: saved && saved.mem || [] }, z, sim);
    const rows = []; let n = 0;
    for (let k = WD.today(), i = 0; n < 4 && i < 14; k = WD.addDays(k, 1), i++) { if (!z.days.includes(WD.wday(k))) continue; n++;
      const p = WD.makePlan(k, sim);
      rows.push(`<div class="wday"><b>${FM("اليوم {0}", n)}</b> <span class="tiny muted">${WD.DAYN[WD.wday(k)]}</span>
        ${p.h ? `<div class="small">📖 <span>حفظ:</span> <span>${WD.rangeTxt(p.h)}</span></div>` : ""}${p.r ? `<div class="small">🔄 <span>مراجعة:</span> ${p.r.map(q => `<span>${FM("الوجه {0}", q)}</span>`).join("، ")}</div>` : z.type !== "tilawa" && z.rPages ? `<div class="small muted">🔄 <span>المراجعة تبدأ بعد أول حفظ</span></div>` : ""}${p.t ? `<div class="small">📚 <span>تلاوة:</span> <span>${WD.pagesTxt(p.t[0], p.t[1])}</span></div>` : ""}</div>`);
      if (p.h) sim.hKey = WD.nextKey(p.h.at(-1)); if (p.t) sim.tPos = p.t[0] + p.t[1] > 604 ? 1 : p.t[0] + p.t[1];
    }
    ST.wird = saved;
    body = `<h3>جدولك جاهز</h3><p class="small muted">هذه أيامك الأولى، ويتحرك الورد تلقائياً مع إنجازك.</p>${rows.join("")}`;
  }
  $("#view").innerHTML = bar("الورد اليومي", `الخطوة ${AR(WZ.step + 1)} من ${AR(steps.length)}`, true) + `<div class="card wz">${body}</div>
    <div class="two"><button class="btn" id="wzBack">${WZ.step ? "السابق" : "إلغاء"}</button><button class="btn primary" id="wzNext">${s === "preview" ? "ابدأ وردي" : "التالي"}</button></div>`;
  $("#back").onclick = () => { WZ.d = null; WZ.step = 0; go("home"); };
  document.querySelectorAll(".wopt[data-k]").forEach(b => b.onclick = () => { const k = b.dataset.k, v = b.dataset.v; z[k] = isNaN(+v) ? v : +v;
    if (k === "nd") z.days = { 7: [0, 1, 2, 3, 4, 5, 6], 6: [0, 1, 2, 3, 4, 6], 5: [0, 1, 2, 3, 4], 4: [0, 1, 2, 3], 3: [0, 2, 4] }[v];
    wirdSetup(); });
  document.querySelectorAll("[data-day]").forEach(b => b.onclick = () => { const i = +b.dataset.day; z.days = z.days.includes(i) ? z.days.filter(x => x !== i) : [...z.days, i].sort(); if (!z.days.length) z.days = [i]; z.nd = z.days.length; wirdSetup(); });
  const num = (id, key, max) => { const e = $(id); if (e) e.oninput = () => { const v = Math.max(1, Math.min(max, +e.value || 0)); if (e.value) { z[key] = v; document.querySelectorAll(`.wopt[data-k="${key}"]`).forEach(b => b.setAttribute("aria-pressed", "false")); } }; };
  num("#hCust", "hLines", 60); num("#tCust", "tPages", 100);
  ["fs", "fj", "fp"].forEach(id => { const e = $("#" + id); if (e) e.onchange = () => { z[id] = Math.max(1, Math.min(id === "fp" ? 604 : 999, +e.value || 1)); }; });
  $("#wzBack").onclick = () => { if (WZ.step) { WZ.step--; wirdSetup(); } else { WZ.d = null; go("home"); } };
  $("#wzNext").onclick = () => {
    if (s !== "preview") { WZ.step++; wirdSetup(); scrollTo(0, 0); return; }
    const st = startPoint(z), old = ST.wird || {};
    ST.wird = Object.assign({}, old, z, { setup: true, hKey: st.k, tPos: st.p, rPos: old.rPos || 0, start: old.start || WD.today(), log: old.log || {}, mem: old.mem || [] });
    if (ST.wird.log[WD.today()] && !Object.keys(ST.wird.log[WD.today()].done).length) delete ST.wird.log[WD.today()];
    save(); WZ.d = null; WZ.step = 0; go("wird");
  };
}
function startPoint(z) {
  if (z.from === "surah") { const k = `${z.fs}:1`; return { k, p: V(k).p }; }
  if (z.from === "juz") { const p = DATA.juz[z.fj][0]; return { k: DATA.pages[p][0], p }; }
  if (z.from === "page") return { k: DATA.pages[z.fp][0], p: +z.fp };
  if (z.from === "last") { const p = ST.last || 1; return { k: DATA.pages[p][0], p }; }
  return { k: "1:1", p: 1 };
}

/* شاشة «وردك اليوم» */
function wird() {
  const w = ST.wird; if (!w || !w.setup) return wirdSetup();
  const k = WD.today(), d = WD.day(k), miss = WD.missed(), tips = WD.tips();
  const card = x => { const done = d.done[x], p = d.plan;
    const btns = x === "h" ? `<button class="btn" data-wa="hread">${ICON.book}${"ابدأ الحفظ"}</button><button class="btn" data-wa="htas">${ICON.mic}${"سمّع المقدار"}</button>`
      : x === "r" ? `<button class="btn" data-wa="rtas">${ICON.mic}${"ابدأ المراجعة"}</button>` : `<button class="btn" data-wa="tread">${ICON.book}${"ابدأ التلاوة"}</button>`;
    return `<div class="card wtask ${done ? "done" : ""}"><div class="row"><span class="we">${TASKN[x][1]}</span><div class="grow"><b>${TASKN[x][0]}</b><div class="small muted">${taskTxt(d, x)}</div>
      ${x === "r" && p.weak && p.weak.length ? `<div class="tiny" style="color:var(--gold)">${"مقدّم لكثرة الخطأ فيه"}</div>` : ""}</div></div>
      ${done ? `<div class="wdone">${ICON.check}${x === "h" ? "تم الحفظ" : x === "r" ? "تمت المراجعة" : "تمت التلاوة"}</div>` : `<div class="wbtns">${btns}<button class="btn primary" data-wd="${x}">${ICON.check}${x === "h" ? "تم الحفظ" : x === "r" ? "تمت المراجعة" : "تمت التلاوة"}</button></div>`}
      ${x === "h" && !done ? `<div class="tiny muted" style="margin-top:8px">${d.ok.filter(q => p.h.includes(q)).length ? `<span>${FM("سمّعت {0} من {1} آيات بنجاح.", d.ok.filter(q => p.h.includes(q)).length, p.h.length)}</span> ` : ""}<span>إذا سمّعت المقدار ونجحت فيه، يسجَّل تلقائياً.</span></div>` : ""}</div>`; };
  $("#view").innerHTML = bar("وردك اليوم 🌿", d ? WD.DAYN[WD.wday(k)] : "", true, `<button class="ibtn" id="wEdit" aria-label="عدّل الورد">${ICON.pen}</button>`) + `
    ${miss && d && !d.choice ? `<div class="card wmiss"><b>${FM(miss === 1 ? "فاتك ورد يوم؟" : miss === 2 ? "فاتك ورد يومين؟" : miss <= 10 ? "فاتك ورد {0} أيام؟" : "فاتك ورد {0} يوماً؟", miss)}</b><div class="small muted" style="margin:4px 0 10px">${"لا بأس، الخطة لم تفشل. هل تريد العودة للخطة الأصلية أم خطة تعويضية تدريجية؟"}</div>
      <div class="two" style="margin-top:0"><button class="btn" data-mc="orig">${"الخطة الأصلية"}</button><button class="btn primary" data-mc="cu">${"خطة تعويضية"}</button></div></div>` : ""}
    ${tips.map(t => `<div class="card wtip"><span>💡</span><div class="grow small">${t.txt}${t.act ? `<div style="margin-top:8px"><button class="link" data-tip="${t.id}">${t.act}</button></div>` : ""}</div></div>`).join("")}
    ${d ? WD.tasks(d).map(card).join("") + `<div class="card"><div class="row"><b class="grow">${"إنجاز اليوم"}</b><b>${AR(Math.round(WD.pct(d) * 100))}٪</b></div>${bar2(WD.pct(d))}
      ${WD.complete(d) ? `<div class="wfin">🌱 ${"اكتمل وردك اليومي"}<div class="small muted">${"أضفت نبتة جديدة إلى بستانك."}</div><button class="link" id="wMore">${"أنجزت أكثر؟ خذ الورد التالي"}</button></div>` : ""}</div>`
      : `<div class="card"><b>${"اليوم يوم راحة"}</b><div class="small muted">${"ليس من أيام وردك. يمكنك المراجعة أو التلاوة متى شئت."}</div></div>`}
    <div class="two"><button class="btn" id="wProg">📈 ${"تقدمي"}</button><button class="btn" id="wGarden">🌱 ${"البستان"}</button></div>`;
  $("#back").onclick = () => go("home");
  $("#wEdit").onclick = () => { WZ.d = null; WZ.step = 0; go("wirdSetup"); };
  $("#wProg").onclick = () => go("progress"); $("#wGarden").onclick = () => go("garden");
  document.querySelectorAll("[data-wd]").forEach(b => b.onclick = () => { WD.markDone(b.dataset.wd); wird(); });
  document.querySelectorAll("[data-wa]").forEach(b => b.onclick = () => { const a = b.dataset.wa, p = d.plan;
    if (a === "hread") openReader(V(p.h[0]).p, "mushaf");
    if (a === "htas") { const left = p.h.filter(q => !d.ok.includes(q)), pg = V((left[0] || p.h[0])).p, on = p.h.filter(q => V(q).p === pg); openTasmee(pg); S.T.noLoc = true; S.T.from = on[0]; S.T.to = on.at(-1); tasmee(); }
    if (a === "rtas") { const left = p.r.filter(q => !(d.rOk || []).includes(q)); openTasmee(left[0] || p.r[0]); S.T.noLoc = true; tasmee(); }
    if (a === "tread") openReader(p.t[0], "mushaf"); });
  document.querySelectorAll("[data-mc]").forEach(b => b.onclick = () => { d.choice = b.dataset.mc; if (b.dataset.mc === "cu") w.catchup = { left: miss * 2 }; save(); wird(); });
  document.querySelectorAll("[data-tip]").forEach(b => b.onclick = () => { const id = b.dataset.tip;
    if (id === "less") { w.hLines = Math.max(3, Math.round(w.hLines * 0.6)); w.tipLess = k; }
    if (id === "more") { w.hLines = Math.min(30, Math.round(w.hLines * 1.4)); w.tipMore = k; }
    if (d && !Object.keys(d.done).length) d.plan = WD.makePlan(k); save(); wird(); });
  const more = $("#wMore"); if (more) more.onclick = () => { d.bonus = (d.bonus || 0) + 1; const old = d; w.log[k] = { plan: WD.makePlan(k), done: {}, ok: [], bonus: old.bonus, prev: (old.prev || []).concat([{ plan: old.plan, done: old.done }]) }; save(); wird(); };
}

/* صفحة «تقدمي» */
function progress() {
  const w = ST.wird || {}, s = w.setup ? WD.streaks() : { cur: 0, best: 0, total: 0 };
  const mem = (w.mem || []).slice().sort((a, b) => a - b);
  const weak = Object.entries(ST.pages).filter(([, r]) => r.errors > 0).sort((a, b) => b[1].errors - a[1].errors).map(([p]) => +p);
  const stat = (v, l) => `<div class="pst"><b>${v}</b><span>${l}</span></div>`;
  $("#view").innerHTML = bar("تقدمي", "رحلتك مع القرآن", true) + `
    <div class="pstats">${stat(AR(w.hAyat || 0), "آية محفوظة")}${stat(AR(mem.length), "وجه محفوظ")}${stat(AR(w.tTotal || 0), "صفحة تلاوة")}
      ${stat(AR(s.total), "يوم التزام")}${stat(AR(s.cur), "السلسلة الحالية")}${stat(AR(s.best), "أطول سلسلة")}</div>
    ${w.khatmat ? `<div class="card" style="text-align:center">🎉 ${FM("ختمات التلاوة: {0}", w.khatmat)}</div>` : ""}
    <div class="sec2"><h2>${"بستانك"}</h2><button id="pGarden">${"افتح البستان"}</button></div>${WD.garden1(true)}
    <div class="sec2"><h2>${"المواضع التي أتممتها"}</h2></div>
    <div class="card">${mem.length ? `<div class="chips">${mem.map(p => `<button class="chip" data-read="${p}">${AR(p)}</button>`).join("")}</div>` : `<div class="small muted">${"لم تُتمّ حفظ موضع بعد."}</div>`}</div>
    <div class="sec2"><h2>${"تحتاج مراجعة"}</h2></div>
    <div class="card">${weak.length ? weak.slice(0, 12).map(p => `<button class="mini" data-tas="${p}"><span class="pn">${AR(p)}</span><span class="grow"><div style="font-weight:600">سورة ${pageSurah(p)}</div><div class="tiny muted">${AR(ST.pages[p].errors)} مواضع ضعف</div></span></button>`).join("") : `<div class="small muted">${"لا مواضع ضعف مسجلة. سمّع ليظهر هنا ما يحتاج مراجعة."}</div>`}</div>`;
  $("#back").onclick = () => go(ST.wird && ST.wird.setup ? "wird" : "home");
  $("#pGarden").onclick = () => go("garden");
  bindAll();
}

/* «البستان» */
function garden() {
  const ps = WD.plants(), s = ST.wird && ST.wird.setup ? WD.streaks() : { cur: 0 };
  const weeks = ps.filter(p => p.week).length;
  $("#view").innerHTML = bar("البستان", "ينمو بإتمام وردك، لا بمجرد فتح التطبيق", true) + `<div class="card">${WD.garden1()}</div>
    <div class="card small"><b>${"كيف ينمو بستانك؟"}</b>
      <div class="glist"><span>🌱</span>${"إتمام الورد = نبتة جديدة"}</div><div class="glist"><span>🌿</span>${"إتمام الحفظ والتلاوة معاً = نمو أكبر"}</div>
      <div class="glist"><span>🌷</span>${"الاستمرار ٥ أيام = زهرة"}</div><div class="glist"><span>🌳</span>${"الاستمرار أسبوعاً = شجرة"}</div>
      <div class="glist"><span>🦋</span>${"كل أسبوع كامل = عنصر جديد في البستان"}</div><div class="glist"><span>🏞️</span>${"كل شهر من الالتزام = مرحلة جديدة للبستان"}</div></div>
    <div class="pstats">${`<div class="pst"><b>${AR(ps.length)}</b><span>${"نبتة"}</span></div><div class="pst"><b>${AR(s.cur)}</b><span>${"السلسلة الحالية"}</span></div><div class="pst"><b>${AR(weeks)}</b><span>${"أسابيع كاملة"}</span></div>`}</div>`;
  $("#back").onclick = () => go(ST.wird && ST.wird.setup ? "wird" : "home");
}

/* بطاقة أول فتح في اليوم */
function wirdMorning() {
  const w = ST.wird; if (!w || !w.setup || S.reader || new URLSearchParams(location.search).get("room")) return;
  const k = WD.today(); if (w.seen === k) return;
  const d = WD.day(k); if (!d || WD.complete(d)) return;
  w.seen = k; save();
  openSheet(`<h3>${"وردك اليوم جاهز 🌱"}</h3><p class="small muted" style="margin-top:0">${"لديك اليوم:"}</p>
    ${WD.tasks(d).map(x => `<div class="wrow"><span class="we">${TASKN[x][1]}</span><span class="grow"><b>${TASKN[x][0]}</b><div class="tiny muted">${taskTxt(d, x)}</div></span></div>`).join("")}
    <button class="btn primary block" style="margin-top:14px" id="mStart">${"ابدأ"}</button>`);
  $("#mStart").onclick = () => { closeSheet(); go("wird"); };
}

TR.start(); render(); setTimeout(() => { if (S.tab === "home") wirdMorning(); }, 900);
LIVE.boot();
</script>
</body>
</html>
